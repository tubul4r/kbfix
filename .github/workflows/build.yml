name: Build KbFix.exe

on:
  workflow_dispatch:        # กดรันเองจากแท็บ Actions
  push:
    branches: [main]        # อัปโหลดโค้ดขึ้นแล้วสร้างให้อัตโนมัติ (ได้ไฟล์ใน Artifacts)
    tags: ["v*"]            # ตั้งแท็ก เช่น v1.0.1 -> สร้าง Release พร้อมไฟล์ .exe (ใช้กับปุ่มอัปเดตในโปรแกรม)

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stamp version and repo
        shell: pwsh
        run: |
          $v = "0.0.0-dev"
          if ("${{ github.ref }}" -like "refs/tags/v*") { $v = "${{ github.ref_name }}".TrimStart("v") }
          Set-Content -Path kbfix_version.py -Value @("__version__ = '$v'", "__repo__ = '${{ github.repository }}'") -Encoding ascii
          Get-Content kbfix_version.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Smoke test (import app)
        run: python -c "import kbfix_app; print('import ok', kbfix_app.__version__)"

      - name: Create icon
        run: python make_icon.py

      - name: Build exe
        run: python -m PyInstaller --noconfirm --clean --onefile --noconsole --name KbFix --icon icon.ico --hidden-import pystray._win32 kbfix_app.py

      - name: Create checksum
        shell: pwsh
        run: |
          if (!(Test-Path dist/KbFix.exe)) { throw "dist/KbFix.exe not found" }
          $h = (Get-FileHash dist/KbFix.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path dist/KbFix.exe.sha256 -Value $h -NoNewline -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: KbFix-windows
          path: dist/KbFix.exe

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/KbFix.exe
            dist/KbFix.exe.sha256
