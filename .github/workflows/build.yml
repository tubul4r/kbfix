name: Build KbFix.exe

on:
  workflow_dispatch:        # กดรันเองจากแท็บ Actions
  push:
    branches: [main]        # อัปโหลดโค้ดขึ้นแล้วสร้างให้อัตโนมัติ
    tags: ["v*"]            # ตั้งแท็ก เช่น v1.0 เพื่อสร้าง Release พร้อมไฟล์ .exe

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Smoke test (import app)
        run: python -c "import kbfix_app; print('import ok')"

      - name: Create icon
        run: python make_icon.py

      - name: Build exe
        run: python -m PyInstaller --noconfirm --clean --onefile --noconsole --name KbFix --icon icon.ico --hidden-import pystray._win32 kbfix_app.py

      - name: Check exe exists
        run: if (!(Test-Path dist/KbFix.exe)) { throw "dist/KbFix.exe not found" }
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: KbFix-windows
          path: dist/KbFix.exe

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/KbFix.exe
